[project]
name = "fpgc"
version = "1.0.0"
description = "FPGC project tools"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Bart Pleiter"}]
dependencies = [
    "click>=8.5.0",
    "hugo==0.168.0",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
]

[project.scripts]
fpgc = "fpgc.cli:main"
b32asm = "b32asm.cli:main"
b32sim = "b32sim.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "Tools"
module-name = ["fpgc", "b32asm", "b32sim"]

[tool.ruff]
src = ["Tools"]
extend-exclude = ["Website/themes"]

[tool.pytest.ini_options]
testpaths = ["Tools", "Tests"]
# -n auto runs the tests in parallel
addopts = ["--import-mode=importlib", "-n", "auto"]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
sort = "-Miss"
