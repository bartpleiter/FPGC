[project]
name = "fpgc"
version = "1.0.0"
description = "Python environment for running FPGC tools and scripts"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Bart Pleiter"}]
dependencies = [
    "bitstring>=4.4.0",
    "mkdocs>=1.6.1",
    "mkdocs-awesome-pages-plugin>=2.10.1",
    "mkdocs-material>=9.7.7",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
skip_covered = true
sort = "-Miss"
