[project]
name = "uartload"
version = "1.0.0"
description = "Loads programs onto the FPGC over UART, through its boot ROM"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Bart Pleiter"}]
dependencies = [
    "click>=8.5.0",
    "pyserial>=3.5",
]

[project.scripts]
uartload = "uartload.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
