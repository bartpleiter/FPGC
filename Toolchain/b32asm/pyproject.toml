[project]
name = "b32asm"
version = "1.0.0"
description = "The assembler for the B32P4 CPU of the FPGC"
readme = "README.md"
requires-python = ">=3.13"
authors = [{name = "Bart Pleiter"}]
dependencies = [
    "click>=8.5.0",
]

[project.scripts]
b32asm = "b32asm.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
